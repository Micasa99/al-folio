    Publications:
      - title: "BAMI: Training-Free Bias Mitigation in GUI Grounding"
        authors:
          - "Borui Zhang*"
          - "Bo Zhang*"
          - "Bo Wang*"
          - "Wenzhao Zheng"
          - "Yuhao Cheng"
          - "Liang Tang"
          - "Yiqiang Yan"
          - "Jie Zhou"
          - "Jiwen Lu"
        publisher: "CVPR 2026"
        releaseDate: 2026-02-28
        url: https://github.com/Neur-IO/BAMI
        summary: >
          Training-free inference-time method that combines coarse-to-fine focus with candidate selection
          to mitigate precision and ambiguity biases in GUI grounding. Lifts TianXi-Action-7B accuracy
          on ScreenSpot-Pro from 51.9% to 57.8%. Co-first author (order decided by coin flip).

      - title: "Grounding LLMs in Scientific Discovery via Embodied Actions"
        authors:
          - "Bo Zhang*"
          - "Jinfeng Zhou*"
          - "Yuxuan Chen"
          - "Jianing Yin"
          - "Minlie Huang"
          - "Hongning Wang"
        publisher: "ICML 2026"
        releaseDate: 2026-05-04
        url: https://anonymous.4open.science/r/EmbodiedAct
        summary: >
          EmbodiedAct grounds LLMs in scientific software via a tight perception–execution loop.
          Instantiated within MATLAB; achieves SOTA on engineering design and scientific modeling
          with strong long-horizon stability. Co-first author.

    Awards:
      - title: Grand Prize (特等奖) — 43rd Tsinghua Challenge Cup, AI Teaching-Agent Track
