        date: 2025-11-15
        awarder: Tsinghua University
        summary: >
          Project AEI4U — an AI teaching assistant for *Fundamentals of Analog Electronics*
          built on the Dify-THU platform. Project Lead.

    Projects:
      - name: AICosmos
        summary: >
          Educational multi-agent platform incubated by Tsinghua's Department of Computer Science.
          Tutor / Role-Play / Q&A agents composed into a course-grade assistant. Live at aicosmos.ai.
        highlights:
          - Multi-agent orchestration
          - Educational and research workflows
        start_date: 2025-09-01
        end_date: ongoing

      - name: Syll
        summary: >
          Self-hosted, MIT-licensed AI companion with a web UI, multi-channel chat, proactive rituals,
          markdown skills, and a desktop ghost. Core contributor at THU-SAGE/syll.
        highlights:
          - Recorded-workflow studio
          - Cross-channel (Telegram, Feishu, Discord, WhatsApp, Web, CLI)
          - PyQt6 desktop ghost
        start_date: 2025-10-01
        end_date: ongoing

      - name: AEI4U
        summary: >
          AI teaching assistant for analog electronics on Dify-THU. Project Lead.
          Won Grand Prize at Tsinghua's 43rd Challenge Cup AI Teaching-Agent track.
        highlights:
